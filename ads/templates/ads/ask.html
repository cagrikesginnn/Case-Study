<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orphex — Sorulara SQL</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffdf9;
      --line: #e7e5e4;
      --accent: #0f766e;
      --accent-ink: #ecfdf5;
      --warn: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #ddf4f0, var(--bg) 45%);
      color: var(--ink);
      min-height: 100vh;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font: inherit;
    }
    button {
      margin-top: 12px;
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .hints {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .hints button.chip {
      margin: 0;
      background: #ecfdf5;
      color: var(--accent);
      border: 1px solid #99f6e4;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 8px 12px;
    }
    pre.sql {
      white-space: pre-wrap;
      word-break: break-word;
      background: #1c1917;
      color: #fafaf9;
      padding: 14px;
      border-radius: 10px;
      overflow: auto;
      font-size: 0.9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 8px 6px;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    .error { color: var(--warn); white-space: pre-wrap; }
    .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Veriye soru sor</h1>
    <p class="lead">
      Türkçe yaz → Mistral SQL üretir → SQLite’a sorgu atılır → tablo gelir.
      Örnek: “en fazla para harcanan gün”, “en çok conversion hangi gün”,
      “Meta’da en çok spend’i olan kampanya”.
    </p>

    <div class="box">
      <label for="q">Sorun</label>
      <textarea id="q" placeholder="Örn: Temmuzda en fazla spend hangi güne ait?"></textarea>
      <div class="hints">
        <button type="button" class="chip" data-q="En fazla para harcanan gün hangisi?">En fazla spend gün</button>
        <button type="button" class="chip" data-q="En fazla spend yapan kampanya hangisi?">En fazla spend kampanya</button>
        <button type="button" class="chip" data-q="En fazla conversion hangi güne ait?">En fazla conversion gün</button>
        <button type="button" class="chip" data-q="Kanallara göre toplam spend nedir?">Kanallara göre spend</button>
        <button type="button" class="chip" data-q="Meta kanalında en yüksek revenue hangi kampanyada?">Meta en yüksek revenue</button>
      </div>
      <button id="askBtn" type="button">Sor</button>
    </div>

    <div class="box" id="sqlBox" hidden>
      <div class="meta">Üretilen SQL</div>
      <pre class="sql" id="sqlOut"></pre>
    </div>

    <div class="box" id="resultBox" hidden>
      <div class="meta" id="resultMeta"></div>
      <div id="resultOut"></div>
    </div>
  </main>

  <script>
    const q = document.getElementById("q");
    const askBtn = document.getElementById("askBtn");
    const sqlBox = document.getElementById("sqlBox");
    const sqlOut = document.getElementById("sqlOut");
    const resultBox = document.getElementById("resultBox");
    const resultMeta = document.getElementById("resultMeta");
    const resultOut = document.getElementById("resultOut");

    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        q.value = btn.dataset.q;
        q.focus();
      });
    });

    function renderTable(columns, rows) {
      if (!rows.length) {
        resultOut.innerHTML = "<p>Sonuç yok.</p>";
        return;
      }
      let html = "<table><thead><tr>";
      columns.forEach((c) => { html += `<th>${c}</th>`; });
      html += "</tr></thead><tbody>";
      rows.forEach((row) => {
        html += "<tr>";
        columns.forEach((c) => {
          const v = row[c] == null ? "" : String(row[c]);
          html += `<td>${v}</td>`;
        });
        html += "</tr>";
      });
      html += "</tbody></table>";
      resultOut.innerHTML = html;
    }

    async function ask() {
      const question = q.value.trim();
      if (!question) {
        q.focus();
        return;
      }
      askBtn.disabled = true;
      askBtn.textContent = "Düşünüyor...";
      sqlBox.hidden = true;
      resultBox.hidden = false;
      resultMeta.textContent = "";
      resultOut.innerHTML = "<p class='meta'>Mistral SQL üretiyor, sonra DB'ye soruyorum...</p>";

      try {
        const res = await fetch("/api/ask/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Bir şey bozuldu");
        }
        sqlBox.hidden = false;
        sqlOut.textContent = data.sql;
        resultMeta.textContent = `${data.row_count} satır`;
        renderTable(data.columns, data.rows);
      } catch (err) {
        sqlBox.hidden = true;
        resultOut.innerHTML = `<p class="error">${err.message}</p>`;
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = "Sor";
      }
    }

    askBtn.addEventListener("click", ask);
    q.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
    });
  </script>
</body>
</html>
